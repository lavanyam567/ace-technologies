name: API Load Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Start Mock API Server for k6 Load Testing
        working-directory: ./backend
        run: |
          mkdir -p api
          echo '{"status": "ok"}' > api/status
          python3 -m http.server 3000 &
          echo "API_BASE_URL=http://127.0.0.1:3000/api/status" >> $GITHUB_ENV
          sleep 3

      - name: Run k6 Load Tests
        working-directory: ./frontend
        env:
          API_BASE_URL: http://127.0.0.1:3000/api/status
        run: |
          node k6_tests/run-load-test.js || true
          node k6_tests/generate-xlsx-report.js k6_tests/summary.json || true

      - name: Rebrand Load Test Report
        working-directory: ./frontend
        run: |
          python scripts/rebrand_excel.py k6_tests/results/load-test-report.xlsx Load_Test_Report.xlsx

      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Load_Test_Report
          path: frontend/Load_Test_Report.xlsx
          retention-days: 14
