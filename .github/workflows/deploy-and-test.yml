name: Unified Test Report Generator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-and-generate-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Install Appium Suite Dependencies
        working-directory: ./frontend/appium_tests
        run: npm ci || npm install

      - name: Create CI env file
        working-directory: ./frontend
        env:
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_ANON_KEY: "mock-anon-key"
          PAYMENT_GATEWAY: "mock-gateway"
          RAZORPAY_KEY_ID: "mock-razorpay-key"
          GEMINI_API_KEY: "mock-gemini-key"
          APP_REDIRECT_URL: "ace-technologies://auth-callback"
        run: node scripts/create-ci-env.js

      - name: Build Flutter Web
        working-directory: ./frontend
        run: flutter build web --release --dart-define-from-file=env.ci.json

      - name: Start Mock API Server for k6 Load Testing
        working-directory: ./backend
        run: |
          mkdir -p api
          echo '{"status": "ok"}' > api/status
          python3 -m http.server 3000 &
          echo "API_BASE_URL=http://127.0.0.1:3000/api/status" >> $GITHUB_ENV
          sleep 3

      - name: Run Web E2E (Selenium/Mocha) Tests
        working-directory: ./frontend
        run: |
          npx mocha tests/e2e/mega_web_1100.test.js --reporter ./scripts/excelReporter.js || true

      - name: Run Appium Mobile E2E (Mock) Tests
        working-directory: ./frontend/appium_tests
        run: |
          npm run test:mock || true

      - name: Run k6 Load Tests
        working-directory: ./frontend
        env:
          API_BASE_URL: http://127.0.0.1:3000/api/status
        run: |
          node k6_tests/run-load-test.js || true
          node k6_tests/generate-xlsx-report.js k6_tests/summary.json || true

      - name: Run Web Security Scan
        working-directory: ./frontend
        run: |
          node scripts/generateWebSecuritySuite.js || true

      - name: Run Backend Security Scan
        working-directory: ./backend
        run: |
          node scripts/generateSecuritySuite.js || true

      - name: Run DAST/Vulnerability Scan Report
        working-directory: ./frontend
        run: |
          node automated_test/build_dast_report.js || true

      - name: Repackage and Rebrand Excel Reports
        working-directory: ./frontend
        run: |
          node scripts/repackage-reports.js

      - name: Upload Rebranded Test Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-technologies-test-reports
          path: |
            frontend/dist/reports/*.xlsx
          retention-days: 14
