name: Deploy and Test Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    # Required permissions for GitHub Pages deployments
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Start Background Vite Preview Server
        working-directory: ./frontend
        run: |
          # Start the server in the background
          npx vite preview --port 5173 --host 127.0.0.1 --base /ace-technologies/ &
          
          # Startup buffer
          sleep 4
          
          # Verify local server is alive
          curl -f http://127.0.0.1:5173/ace-technologies/ || exit 1
          
          # Export to GITHUB_ENV
          echo "TEST_BASE_URL=http://127.0.0.1:5173/ace-technologies/" >> $GITHUB_ENV

      - name: Run E2E Test Suite (1,100 Tests)
        working-directory: ./frontend
        run: |
          # Ensure mocha is available and run the mega test suite with the custom reporter
          npx mocha tests/e2e/mega_web_1100.test.js --reporter ./scripts/excelReporter.js

      - name: Inject HTML Report to Dist Directory
        working-directory: ./frontend
        run: |
          # The reporter generated execution-report.html in the current dir
          mkdir -p dist/reports/latest
          mkdir -p dist/reports/history/build-${{ github.run_number }}
          
          cp execution-report.html dist/reports/latest/execution-report.html
          cp execution-report.html dist/reports/history/build-${{ github.run_number }}/execution-report.html

      - name: Generate Markdown Summary
        working-directory: ./frontend
        run: node ./scripts/generate-markdown-summary.js

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
