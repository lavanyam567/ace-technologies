name: Web & Backend Security Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run Web Security Scan
        working-directory: ./frontend
        run: |
          node scripts/generateWebSecuritySuite.js || true

      - name: Run Backend Security Scan
        working-directory: ./backend
        run: |
          node scripts/generateSecuritySuite.js || true

      - name: Rebrand Security Reports
        run: |
          python frontend/scripts/rebrand_excel.py frontend/web-security-findings.xlsx frontend/web-security-findings-rebranded.xlsx
          python frontend/scripts/rebrand_excel.py backend/backend-findings.xlsx backend/backend-findings-rebranded.xlsx

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security_Findings_Reports
          path: |
            frontend/web-security-findings-rebranded.xlsx
            backend/backend-findings-rebranded.xlsx
          retention-days: 14
