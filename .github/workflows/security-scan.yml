name: Security Review Pipelines

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install xlsx

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install xlsx

      - name: Run Web Frontend Security Suite
        working-directory: ./frontend
        env:
          NODE_ENV: production
        run: node ./scripts/generateWebSecuritySuite.js

      - name: Run Backend Security Suite
        working-directory: ./backend
        env:
          NODE_ENV: production
        run: node ./scripts/generateSecuritySuite.js

      - name: Publish Security Reports to Step Summary
        run: |
          cat frontend/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat backend/executive-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce Zero-Critical Gate
        run: |
          # Extract Critical count from the backend summary
          CRITICAL_COUNT=$(grep -oP '\|\s*Critical\s*\|\s*\K\d+' backend/executive-summary.md)
          
          if [ -z "$CRITICAL_COUNT" ]; then
            echo "Could not determine critical count. Failing safely."
            exit 1
          fi
          
          echo "Found $CRITICAL_COUNT Critical findings."
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Security Gate Failed: Critical vulnerabilities found!"
            exit 1
          else
            echo "Security Gate Passed: 0 Critical vulnerabilities."
          fi

      - name: Upload Excel Security Findings Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-excel-reports
          path: |
            frontend/web-security-findings.xlsx
            backend/backend-findings.xlsx
