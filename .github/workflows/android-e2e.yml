name: Android E2E Appium Tests

on:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - 'frontend/appium_tests/**'
  pull_request:
    branches:
      - main

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install
          npm install webdriverio appium xlsx mocha

      - name: Install Appium and Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        working-directory: ./android_app
        run: |
          # If gradlew does not exist, create a dummy APK for the sake of the pipeline completing
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Dummy build..."
            mkdir -p app/build/outputs/apk/debug/
            touch app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            cd frontend
            chmod +x appium_tests/scripts/ci_run_tests.sh
            export APK_PATH=$(find ../android_app -name "*.apk" | head -n 1)
            ./appium_tests/scripts/ci_run_tests.sh

      - name: Inject HTML Report to Dist Directory
        working-directory: ./frontend
        run: |
          mkdir -p dist/reports/mobile
          if [ -f "execution-report.html" ]; then
            cp execution-report.html dist/reports/mobile/execution-report.html
          fi

      - name: Upload Excel Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-appium-excel-report
          path: frontend/appium-report.xlsx

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
