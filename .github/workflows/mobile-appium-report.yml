name: Appium Mobile E2E Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  appium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Install Appium Dependencies
        working-directory: ./frontend/appium_tests
        run: npm ci || npm install

      - name: Run Appium Mock E2E Tests
        working-directory: ./frontend/appium_tests
        run: |
          npm run test:mock || true

      - name: Rebrand Appium Report
        working-directory: ./frontend/appium_tests
        run: |
          latest_report=$(ls -t reports/Ace_Technologies_Appium_TestReport_*.xlsx 2>/dev/null | head -n 1)
          if [ -n "$latest_report" ]; then
            python ../scripts/rebrand_excel.py "$latest_report" Appium_E2E_Report_AceTechnologies.xlsx
          else
            echo "Error: No Appium report found to rebrand!"
            exit 1
          fi

      - name: Upload Appium Report
        uses: actions/upload-artifact@v4
        with:
          name: Appium_E2E_Report_AceTechnologies
          path: frontend/appium_tests/Appium_E2E_Report_AceTechnologies.xlsx
          retention-days: 14
